name: tier2_lr_low
env: LunarLander-v3
agent: dqn
seeds: [0, 1, 2]
total_steps: 500000
eval_every: 10000
eval_episodes: 10
final_eval_episodes: 100
threshold: 200
agent_params:
  hidden: [128, 128]
  lr: 0.00025
  gamma: 0.99
  buffer_size: 100000
  batch_size: 64
  learning_starts: 1000
  train_every: 4
  target_update_every: 500
  eps_start: 1.0
  eps_end: 0.05
  eps_decay_steps: 50000
  loss: mse
